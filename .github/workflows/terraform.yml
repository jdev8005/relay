name: terraform

on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']

permissions:
  contents: read
  id-token: write        # required for OIDC
  pull-requests: write

env:
  TF_VERSION: "1.16.0"   # match your local `terraform version`
  AWS_REGION: us-east-2

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: relay_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psecret"
          --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, redis, bcmath, pcntl, zip
          coverage: none

      - working-directory: app
        run: composer install --prefer-dist --no-interaction --no-progress

      - working-directory: app
        run: cp .env.example .env && php artisan key:generate

      - working-directory: app
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: relay_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - working-directory: app
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: relay_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          WEBHOOK_SECRET_ACME: ci-test-secret

  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/relay-gha-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        working-directory: terraform
        run: terraform init

      - name: validate
        working-directory: terraform
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: terraform
        run: tflint --init && tflint

      - name: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: plan
        working-directory: terraform
        run: terraform plan -no-color -input=false

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: production        # this line gates the apply role
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/relay-gha-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        working-directory: terraform
        run: terraform init

      - name: apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false
