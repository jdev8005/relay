name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.0"
  AWS_REGION: us-east-2

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - 'bootstrap/**'
              - '.github/workflows/terraform.yml'
  plan:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/relay-gha-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        working-directory: terraform
        run: terraform init

      - name: validate
        working-directory: terraform
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: terraform
        run: tflint --init && tflint

      - name: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: plan
        working-directory: terraform
        run: terraform plan -no-color -input=false

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: production        # this line gates the apply role
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/relay-gha-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        working-directory: terraform
        run: terraform init

      - name: apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

  gate:
    name: terraform-gate
    if: always()
    needs: [changes, plan, apply]
    runs-on: ubuntu-24.04
    steps:
      - name: check results
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"failure"'; then
            echo "A required job failed."
            exit 1
          fi
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"cancelled"'; then
            echo "A required job was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
