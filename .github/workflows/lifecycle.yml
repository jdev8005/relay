name: lifecycle

on:
  schedule:
    # Primary nightly teardown. Off the top of the hour, when GitHub's
    # scheduler is busiest and most likely to delay or drop runs.
    - cron: "17 2 * * *"
      timezone: "America/New_York"
    # Backstop. A no-op if the first run worked; catches a dropped run.
    - cron: "47 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      action:
        description: "up = build the stack, down = tear it down"
        required: true
        type: choice
        options: [up, down]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.0"
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    shell: bash               # explicit shell turns on -o pipefail
    working-directory: terraform

jobs:
  up:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'up'
    runs-on: ubuntu-24.04
    environment: production   # same approval and role as a merge-time apply
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: relay-prod-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/relay-gha-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        run: terraform init -input=false

      - name: apply
        run: terraform apply -auto-approve -input=false -lock-timeout=10m

      - name: verify convergence
        # Exit 0 = no changes, 2 = changes pending, 1 = error. Only 0 passes.
        run: terraform plan -detailed-exitcode -input=false -lock-timeout=10m

      - name: summary
        run: |
          {
            echo "### Stack is up"
            echo "NAT public IP: \`$(terraform output -raw nat_public_ip)\`"
            echo ""
            echo "Tear down when finished: \`gh workflow run lifecycle.yml -f action=down\`"
          } >> "$GITHUB_STEP_SUMMARY"

  down:
    if: github.event_name == 'schedule' || inputs.action == 'down'
    runs-on: ubuntu-24.04
    environment: teardown
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: relay-prod-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/relay-gha-teardown
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        run: terraform init -input=false

      - name: plan destroy
        run: terraform plan -destroy -out=destroy.tfplan -input=false -lock-timeout=10m

      - name: guard protected resource types
        run: |
          protected="aws_s3_bucket aws_kms_key aws_kms_alias aws_ecr_repository aws_iam_openid_connect_provider aws_budgets_budget"
          deleting=$(terraform show -json destroy.tfplan \
            | jq -r '[.resource_changes[]? | select(.change.actions | index("delete")) | .type] | unique | .[]')
          echo "Resource types this destroy would delete:"
          echo "${deleting:-<none>}"
          for t in $protected; do
            if grep -qx "$t" <<<"$deleting"; then
              echo "::error::Destroy plan includes protected type $t. Refusing."
              exit 1
            fi
          done

      - name: destroy
        run: terraform apply -input=false -lock-timeout=10m destroy.tfplan

      - name: verify nothing billable survived
        # Ask AWS, not Terraform state. State only knows what Terraform recorded.
        run: |
          nat=$(aws ec2 describe-nat-gateways \
            --filter Name=state,Values=pending,available \
            --query 'length(NatGateways)' --output text)
          eip=$(aws ec2 describe-addresses --query 'length(Addresses)' --output text)
          echo "NAT gateways: $nat   Elastic IPs: $eip"
          if [ "$nat" != "0" ] || [ "$eip" != "0" ]; then
            echo "::error::Billable network resources still exist after teardown"
            exit 1
          fi
